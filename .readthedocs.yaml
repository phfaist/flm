# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# See uv builds on RTD:
# https://docs.readthedocs.io/en/stable/build-customization.html#install-dependencies-with-uv

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04

  tools:
    python: "3.10"

  jobs:

    post_create_environment:
      # Install uv
      # https://docs.astral.sh/uv/getting-started/installation/
      - 'pip install uv'

    post_install:
      # Install dependencies with the 'builddoc' dependency group.
      # '--active' installs into the virtualenv that RTD created for us rather
      # than into a project-local '.venv'; '--inexact' leaves the packages that
      # RTD itself put there alone.
      - 'VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH uv sync --active --inexact --extra maincmdl --group builddoc'


sphinx:
  configuration: doc/conf.py
  builder: 'dirhtml'
