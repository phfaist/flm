# The extension `phfpack`: notation macros for quantum information (bras and kets, norms,
# operators, gates, groups, entropies), each a user definition replaced by its template
# in the document's tree, with delimiters drawn at the size a use asks for.
#
# One crate written against the guest client `flm_ext::guest`, in two forms: compiled into
# the `flm` program (the crate `flm-extensions` lists it under its cargo feature `native`),
# and built as a WebAssembly module by `extensions/rust/build-wasm.sh`. The library keeps
# its default type, which a program depends on; the script builds the module with
# `cargo rustc --crate-type cdylib`.
[package]
name = "phfpack"
description = "The FLM extension `phfpack`: notation and quantity macros for quantum information"
version.workspace = true
edition.workspace = true
# Rust 1.88, the floor of `flm-ext`, which the crate is written against.
rust-version = "1.88"
authors.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The guest client alone: the program that compiles the crate in turns on `flm-ext`'s
# feature `native`, and a build of the WebAssembly form leaves it off.
flm-ext = { path = "../../../flm-ext", default-features = false, features = ["guest"] }
# The feature's settings: their data types are read with serde from the configuration
# that `register` receives as a JSON value, and described with schemars, whose schema the
# feature declares.
serde = { version = "1", features = ["derive"] }
schemars = { version = "1", default-features = false, features = ["derive", "std", "preserve_order"] }
serde_json = "1"

# The tests (`tests/`) build a registry with the library and load the extension through the
# extension interface's loader, with the engine `native`, which runs the crate compiled in:
# the library without its default cargo feature (its stages run in parallel), as a program
# that carries the extension chooses that feature, and `flm-ext` with `native`. A build of
# the WebAssembly form compiles the library alone, which takes neither.
[dev-dependencies]
flm-core = { path = "../../../flm-core", default-features = false }
flm-ext = { path = "../../../flm-ext", default-features = false, features = ["native"] }
