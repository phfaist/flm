[package]
name = "flm-extensions"
description = "The extensions shipped with FLM, each under a cargo feature of its own: their files as data, and the code of those written in Rust"
version.workspace = true
edition.workspace = true
# Rust 1.88, the floor of `flm-ext`, which defines the types of the tables and which the
# extensions written in Rust are compiled against.
rust-version = "1.88"
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

# docs.rs, which builds the API documentation of the published crate, ignores
# `.cargo/config.toml`. These settings make it turn on every feature of the crate, so
# that its pages show the items of each feature and their links resolve, and add the
# sidebar customization that `cargo docs` adds locally (the path resolves from the
# package root, where `docs` links to the workspace's `docs/` folder).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/rustdoc-header.html"]

[lints]
workspace = true

# One feature per shipped extension, named as its folder. The feature of an extension adds
# its row to the table of files `EXTENSIONS` (the build script reads the features that cargo
# sets); the feature of an extension written in Rust also compiles its module, adds its row
# to the table of code `COMPILED_EXTENSIONS`, and turns on its dependencies and the guest
# client of `flm-ext`. The feature `collection` also turns on the guest client. The features
# are additive, and none is on by default.
[features]
# The extensions of the engine `data` (the folder `data/`).
lecturenotes = []
# The extensions of the engine `js` (the folder `js/`).
letter = []
math-mathjax = []
# The extensions written in Rust (the folder `rust/`).
flmdoc = ["flm-ext/guest", "dep:serde_json"]
math-techxt = ["flm-ext/guest", "dep:serde_json", "dep:techxt", "dep:serde", "dep:schemars"]
phfpack = ["flm-ext/guest", "dep:serde_json", "dep:serde", "dep:schemars"]
profile-pdf-latex = ["flm-ext/guest", "dep:serde_json"]
profile-tty = ["flm-ext/guest", "dep:serde_json", "dep:image", "dep:base64"]
syntax-highlight = ["flm-ext/guest", "dep:serde_json", "dep:syntect"]
# The crate built as a WebAssembly module is a collection: the build script also writes the
# record of every file of every extension whose feature is on, which the module holds in its
# custom section `flmextensions` (`flm_ext::collection`). The module has the exports of the
# guest's ABI whether or not an extension written in Rust is among its features, so the
# feature turns on the guest client of `flm-ext`, and the table of code exists even with no
# row. The records and the exports are compiled for `wasm32` only, so the feature changes
# nothing in what a program that links the crate does. The feature `all` does not turn it
# on.
collection = ["flm-ext/guest"]
# Every shipped extension.
all = ["lecturenotes", "letter", "math-mathjax", "flmdoc", "math-techxt", "phfpack", "profile-pdf-latex", "profile-tty", "syntax-highlight"]

[dependencies]
# The types of the tables: the rows of a table of files (`flm_ext::source`), and, with the
# feature of an extension written in Rust or the feature `collection`, the guest client
# (`flm_ext::guest`), which those
# extensions are written against and which defines the rows of a table of code. The program
# that compiles the extensions in turns on `flm-ext`'s feature `native`; a build of the
# WebAssembly form leaves it off.
flm-ext = { workspace = true, default-features = false }
# The dependencies of the extensions written in Rust, each turned on by the features of the
# extensions that use it.
serde_json = { version = "1", optional = true }
# The converter from LaTeX to Unicode text (`math-techxt`), without its default feature
# `xp`: its parse language is then techy's plain `Latexlike`, named through techxt's
# re-exports, and techy-xp is neither compiled nor linked.
techxt = { version = "0.2.1", default-features = false, optional = true }
# The settings of `math-techxt` and `phfpack`: their data types are described with
# schemars, whose schema the feature declares, and read and written with serde.
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", default-features = false, features = ["derive", "std", "preserve_order"], optional = true }
# Decodes an image's content to draw it as half-block characters (`profile-tty`): the
# version and the formats of the program's own dependency.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"], optional = true }
# Reads an image's content, which reaches `profile-tty` in the data form `{ base64 }`: the
# version of `flm-ext`'s own dependency.
base64 = { version = "0.23", optional = true }
# The highlighter of `syntax-highlight`.
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"], optional = true }

# The tests of `math-techxt` and `phfpack` build a registry with the library and load the
# extension through the extension interface's loader, with the engine `native`, which runs
# the module compiled in: `flm-core` without its default cargo feature, as a program that
# carries the extension chooses that feature, and `flm-ext` with `native`. A build of the
# WebAssembly form compiles the library alone, which takes neither.
[dev-dependencies]
flm-core = { workspace = true, default-features = false }
flm-ext = { workspace = true, default-features = false, features = ["native"] }

# The tests of the extensions written in Rust, in their folders, each named after its
# extension and built with its feature.
[[test]]
name = "math-techxt-latex"
path = "rust/math-techxt/tests/latex.rs"
required-features = ["math-techxt"]

[[test]]
name = "math-techxt-lowering"
path = "rust/math-techxt/tests/lowering.rs"
required-features = ["math-techxt"]

[[test]]
name = "math-techxt-output"
path = "rust/math-techxt/tests/output.rs"
required-features = ["math-techxt"]

[[test]]
name = "math-techxt-registry"
path = "rust/math-techxt/tests/registry.rs"
required-features = ["math-techxt"]

[[test]]
name = "math-techxt-render"
path = "rust/math-techxt/tests/render.rs"
required-features = ["math-techxt"]

[[test]]
name = "math-techxt-settings"
path = "rust/math-techxt/tests/settings.rs"
required-features = ["math-techxt"]

[[test]]
name = "phfpack-macros"
path = "rust/phfpack/tests/macros.rs"
required-features = ["phfpack"]

[[test]]
name = "phfpack-quantities"
path = "rust/phfpack/tests/quantities.rs"
required-features = ["phfpack"]

[[test]]
name = "phfpack-registry"
path = "rust/phfpack/tests/registry.rs"
required-features = ["phfpack"]

[[test]]
name = "phfpack-settings"
path = "rust/phfpack/tests/settings.rs"
required-features = ["phfpack"]

[[test]]
name = "phfpack-sizing"
path = "rust/phfpack/tests/sizing.rs"
required-features = ["phfpack"]

# A collection built from the crate for WebAssembly, read back (gated on
# `FLM_TESTS_WASM_GUEST=1`).
[[test]]
name = "collection"
path = "tests/collection.rs"
required-features = ["flmdoc", "profile-pdf-latex", "lecturenotes"]
