<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FLM document</title>
<style data-flm-def="flm.html.style.page">/* flm.html.style.page */
/* The page's own typography and the width of its content.  This is the
   only stylesheet of the HTML backend with rules whose selectors do not
   begin with a class of the HTML contract (the classes and attributes that
   the backend promises to write), apart from the :root rule that declares
   the custom properties: it sets the text size on the page's root element
   and styles the page's body, which a document does not have.  No element
   requires it: the backend adds it to the style and
   script definitions of every page that it renders (the definitions table
   flm.html.definitions).  A host that places the HTML output in a page of
   its own leaves this stylesheet out through the HTML backend's render
   option definitions (DefinitionOverride::ProvidedByHost, or an empty list
   of parts). */
@layer flm {
  :root {
    /* The page's text: its font family, its size, its line height, and its
       two colors. */
    --flm-page-family: "Source Serif 4", "Times New Roman", Times, serif;
    --flm-page-size: 100%;
    --flm-page-line-height: 1.5;
    --flm-page-color: #1a1a1a;
    --flm-page-background: #ffffff;
    /* How wide the content runs, and the space around it: on its left and
       right sides, and above and below it.  The space above and below is the
       space on the sides unless a page sets it apart; it follows a value of
       --flm-page-padding that a page sets on :root, where the custom
       properties are set. */
    --flm-page-measure: 42rem;
    --flm-page-padding: 1.5rem;
    --flm-page-padding-vertical: var(--flm-page-padding);
    /* The width of the column for the notes set beside the text, and the gap
       before it: the same two values as in flm.html.style.core, declared here
       as well because each stylesheet declares every property it uses.  A
       host that changes them sets them once, outside the cascade layer flm,
       and both stylesheets read the new values. */
    --flm-margin-note-width: 8rem;
    --flm-margin-note-gap: 1rem;
  }

  /* The page's text size, set on the page's root element rather than on its
     body: the rem unit is the root element's size, and the stylesheets give
     in rem the lengths that follow the page's text rather than the text
     around them (the width of the content, a note beside the text, the
     document's title). */
  :root {
    font-size: var(--flm-page-size);
  }

  /* The page itself.  Apart from the :root rules, this is the only rule of
     the backend's stylesheets that does not begin with a class of the HTML
     contract.  With the rule above, it styles the page, which is why a host
     that places the HTML output in a page of its own leaves this stylesheet
     out (see the top of this stylesheet). */
  body {
    margin: 0;
    background: var(--flm-page-background);
    color: var(--flm-page-color);
    font-family: var(--flm-page-family);
    line-height: var(--flm-page-line-height);
  }

  /* The element that holds the document's content.  When the window is wide
     enough for a column of notes to the right of the text (see
     flm.html.style.core, --flm-margin-note-width and --flm-margin-note-gap),
     this element leaves room for that column: its maximum width and its
     right padding both grow by the column and the gap, so the text keeps
     the width it has without the column; and it turns on the switch
     --flm-margin-note-column of flm.html.style.core, so that the notes
     inside it are placed in the column.  52rem is the content's width with
     the column (42rem + 8rem + 1rem) plus a little room; it is written as a
     number because a media condition cannot read a custom property, and a
     rem in a media condition is the browser's text size, not the page's, so
     a page that widens the text or the column, or sets a text size other
     than the browser's, writes its own condition. */
  .flm-content {
    box-sizing: border-box;
    max-width: var(--flm-page-measure);
    margin: 0 auto;
    padding: var(--flm-page-padding-vertical) var(--flm-page-padding);
  }
  @media (min-width: 52rem) {
    .flm-content {
      --flm-margin-note-column: ;
      max-width: calc(var(--flm-page-measure) + var(--flm-margin-note-width) + var(--flm-margin-note-gap));
      padding-right: calc(var(--flm-page-padding) + var(--flm-margin-note-width) + var(--flm-margin-note-gap));
    }
  }
}
</style>
<style data-flm-def="math-mathjax.style">/* math-mathjax.style */
/* The formulas the math-mathjax extension writes as MathML: the math fonts,
   a displayed formula as a centered block, the table of an environment's
   equation lines at full width with each line in the middle (between an
   empty cell and the cell of its tag, each half of the width that remains)
   and the tag at the right edge, and the text inside a formula (the content
   of an mtext element) in the page's font. */
@layer flm {
  math {
    font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", math;
  }
  math[display="block"] {
    display: block math;
    margin: 0.5em 0;
    text-align: center;
  }
  mtable.math-mathjax-lines {
    width: 100%;
  }
  mtd.math-mathjax-tag-space,
  mtd.math-mathjax-tag {
    width: 50%;
  }
  mtd.math-mathjax-tag {
    text-align: right;
    white-space: nowrap;
  }
  math mtext {
    font-family: var(--flm-page-family, serif);
  }
}
</style>
    <style>
      /* The header and the table of contents are inside the element
         .flm-content, so they take the width, the side padding and the room
         for the margin-note column that flm.html.style.page gives the text:
         the line under the header is exactly as wide as the text, and on a
         narrow screen the header keeps the same space from the edge as the
         text. */
      @layer flm {
        /* The text is 16px whatever the browser's text size, and the space on
           each side of the content is narrower than flm.html.style.page's;
           the space above and below the content keeps that stylesheet's
           value. */
        :root {
          --flm-page-size: 16px;
          --flm-page-padding: .75rem;
          --flm-page-padding-vertical: 1.5rem;
        }
        /* The header holding the title, the authors and the date, with a line
           under it. */
        .flm-content > header {
          margin-bottom: 2em;
          padding-bottom: 1em;
          border-bottom: 1px solid currentColor;
        }
      }
    </style>
  </head>
  <body>
    <main class="flm-content" id="flm-content">
<div id="flm-region-content">
The square <math xmlns="http://www.w3.org/1998/Math/MathML" class="flm-math-formula" data-flm-display="inline"><msup><mi>x</mi><mn>2</mn></msup></math>. 
</div>
    </main>
  </body>
</html>
