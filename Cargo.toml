# flm-rs — the Rust implementation of FLM, built on the techy parser toolkit.

[workspace]
resolver = "3"
members = ["flm-core", "flm-host", "flm", "flm-info", "flm-ext", "extensions"]
# prototypes/* are standalone packages (each carries its own [workspace] table),
# deliberately outside this workspace: probe code pins nothing on the real crates.

[workspace.package]
# The version of every crate of the workspace. `[workspace.dependencies]` below writes it
# again for each crate there, since a dependency cannot read it from here: a new version
# changes all six places.
version = "0.6.0"
# Toolchain: edition 2024, and a minimum supported Rust version of 1.86, which
# matches techy's own floor (`dyn` trait upcasting) so that flm never claims
# support below its dependency. Both are soft choices: revise them if a needed
# language feature requires a later Rust.
edition = "2024"
rust-version = "1.86"
authors = ["Philippe Faist"]
# The Rust ecosystem's usual dual license; the two texts are at the repository
# root as LICENSE-APACHE and LICENSE-MIT. Every crate inherits this field.
license = "MIT OR Apache-2.0"
# The public repository of the sources, which crates.io shows on each crate's page.
# Every crate inherits this field.
repository = "https://github.com/phfaist/flm"
# The words and the categories under which crates.io lists each crate (at most five
# keywords; the categories are slugs of crates.io's own list). Every crate inherits
# both fields, except `flm`, which adds the category of command-line programs.
keywords = ["latex", "markup", "flm", "document"]
categories = ["text-processing"]

# The crates of the workspace, as the others depend on them: by path, with the
# workspace's version beside it, which the package of a crate keeps. The three
# libraries are listed without their default features; each crate that depends on
# one of them says whether it takes them.
[workspace.dependencies]
flm-core = { path = "flm-core", version = "0.6.0", default-features = false }
flm-ext = { path = "flm-ext", version = "0.6.0", default-features = false }
flm-host = { path = "flm-host", version = "0.6.0", default-features = false }
flm-info = { path = "flm-info", version = "0.6.0" }
flm-extensions = { path = "extensions", version = "0.6.0" }

# Lint posture: missing_docs is a warning while the public API is still
# settling; promote it to "deny" at the first release. Documentation link rot
# fails the docs build from the start.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"

[profile.release]
lto = true
codegen-units = 1

# The WebAssembly form of an extension written in Rust, built by
# `extensions/rust/build-wasm.sh`: the release profile, optimized for size, a panic
# aborting the module (a trap, whose message the guest client keeps for the host).
[profile.wasm-extension]
inherits = "release"
panic = "abort"
opt-level = "s"
