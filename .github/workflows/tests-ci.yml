
name: 'tests-ci'


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # schedule:
  #   - cron: "13 20 * * 3"

jobs:
  tests-ci:

    strategy:
      fail-fast: true
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        os:
          - 'ubuntu-latest'

    runs-on: '${{ matrix.os }}'

    steps:
      - uses: actions/checkout@v3

      - name: 'Set up uv'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '${{ matrix.python-version }}'

      - name: 'uv sync'
        run: 'uv sync --extra maincmdl'

      - name: 'Run tests'
        run: 'uv run --no-sync pytest'
